# Valores de EXEMPLO/placeholder para uso local (Minikube). Nunca
# commitar senha real aqui — em um ambiente de verdade isso viria de
# um cofre de segredos (Sealed Secrets, Vault, External Secrets etc.),
# nunca de um Secret "puro" versionado no Git.
apiVersion: v1
kind: Secret
metadata:
  name: sistema-principal-veiculos-secret
  labels:
    app: sistema-principal-veiculos
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-core:5432/veiculos_core_db
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
