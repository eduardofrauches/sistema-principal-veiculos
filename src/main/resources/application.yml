server:
  port: 8081

spring:
  application:
    name: sistema-principal-veiculos

  datasource:
    url: jdbc:postgresql://localhost:5432/veiculos_core_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # "update" nesta etapa inicial (sem Flyway/Liquibase ainda) so para
      # o schema ser criado automaticamente a partir das *Entity JPA.
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# URL base do servico-vendas-veiculos, usado pelo VendasServiceHttpAdapter
# para sincronizar veiculos apos cadastro/edicao.
servico-vendas:
  base-url: ${SERVICO_VENDAS_BASE_URL:http://localhost:8082}
